<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РУЛЕТКА ТЕМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ТОКЕНЫ
   Светлая редакционная база + чёрная инверсия для барабана.
   ============================================================ */
:root{
  --paper:#ffffff;
  --paper-2:#f2f0ec;
  --ink:#0a0a0a;
  --ink-2:#5c5c5c;
  --ink-3:#9a9a9a;
  --rule:#e2e0dc;
  --rule-2:#c9c7c2;

  --red:#e8442e;
  --acid:#c6f135;
  --blue:#2b44ff;
  --black:#101010;

  /* уровень сложности = цвет = награда */
  --c-common:#2b44ff;   /* синий  · базовая */
  --c-rare:#ff2e88;     /* розовый· средняя */
  --c-epic:#e0a000;     /* золото · сложная */

  --ok:#0f8f52;
  --bad:#e8442e;

  --disp:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --text:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:40px; --sp-5:64px; --sp-6:96px;
  --fast:.16s cubic-bezier(.4,0,.2,1);
  --mid:.4s cubic-bezier(.16,1,.3,1);
  --spin:5.4s cubic-bezier(.08,.66,.1,1);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--text);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  transition:background .45s cubic-bezier(.16,1,.3,1), color .45s;
}
/* ТЁМНАЯ ТЕМА — выбор пользователя */
body.theme-dark{
  --paper:#121212; --paper-2:#1c1c1c; --ink:#f4f4f4; --ink-2:#a4a4a4; --ink-3:#6a6a6a;
  --rule:#2a2a2a; --rule-2:#3d3d3d;
  --c-common:#6d82ff; --c-rare:#ff5ca5; --c-epic:#ffc328;
  --ok:#3ddc97;
  background:#121212;color:#f4f4f4;
}
/* АРЕНА — всегда чернее фона, вне зависимости от темы */
body.arena{
  --paper:#000000; --paper-2:#0d0d0d; --ink:#ffffff; --ink-2:#9a9a9a; --ink-3:#5e5e5e;
  --rule:#222222; --rule-2:#383838;
  --c-common:#6d82ff; --c-rare:#ff5ca5; --c-epic:#ffc328;
  background:#000;color:#fff;
}
/* читаемость акцентов на тёмном */
body.theme-dark .mat strong,
body.arena .mat strong{background:linear-gradient(transparent 62%,rgba(198,241,53,.3) 62%)}
.wrap{max-width:1180px;margin:0 auto;padding:var(--sp-3) var(--sp-3) var(--sp-6)}
.scr{display:none;animation:rise .45s cubic-bezier(.16,1,.3,1)}
.scr.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============================================================
   ТИПОГРАФИКА
   ============================================================ */
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0}
h1{font-size:clamp(38px,8vw,86px);line-height:.94;letter-spacing:-.045em;text-transform:lowercase}
h2{font-size:clamp(28px,5.4vw,54px);line-height:1;letter-spacing:-.035em;margin-bottom:var(--sp-2)}
h3{font-size:clamp(19px,2.6vw,26px);line-height:1.12;letter-spacing:-.02em}
.eyebrow{
  font-family:var(--text);font-size:11px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-3);
}
.rule{width:52px;height:3px;background:var(--ink);margin:var(--sp-2) 0 var(--sp-3)}
.sub{color:var(--ink-2);font-size:16px;margin:var(--sp-2) 0 var(--sp-4);max-width:64ch}
.lede{font-family:var(--disp);font-size:clamp(19px,2.5vw,27px);line-height:1.28;letter-spacing:-.02em;max-width:22ch}

/* ============================================================
   КНОПКИ
   ============================================================ */
button{font:inherit;cursor:pointer;border:none;transition:var(--fast);font-family:var(--text)}
.btn{
  background:var(--ink);color:var(--paper);padding:17px 34px;font-weight:700;font-size:14px;
  letter-spacing:.11em;text-transform:uppercase;border-radius:0;position:relative;overflow:hidden;
}
.btn:hover{background:var(--red);color:#fff;transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:none;box-shadow:none}
.btn:disabled{background:var(--rule);color:var(--ink-3);cursor:not-allowed;transform:none;box-shadow:none}
.btn.big{padding:24px 62px;font-size:16px;letter-spacing:.16em}
.btn.acid{background:var(--acid);color:#0a0a0a}
.btn.acid:hover{background:var(--paper);color:var(--acid);box-shadow:5px 5px 0 var(--acid)}

.btn2{background:none;color:var(--ink);border:2px solid var(--ink);padding:15px 28px;
      font-weight:700;font-size:13px;letter-spacing:.11em;text-transform:uppercase;border-radius:0}
.btn2:hover{background:var(--ink);color:var(--paper)}
.btn3{background:none;color:var(--ink-2);padding:6px 0;margin-right:20px;font-size:13px;
      border-bottom:2px solid transparent;border-radius:0}
.btn3:hover{color:var(--ink);border-bottom-color:var(--red)}

/* ============================================================
   ШАПКА
   ============================================================ */
.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-4);
          padding-bottom:var(--sp-3);border-bottom:3px solid var(--ink);margin-bottom:var(--sp-4);flex-wrap:wrap}
.hud{display:flex;flex-direction:column;gap:12px;min-width:250px}
.lvlrow{display:flex;align-items:center;gap:12px}
.lvlbadge{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
          padding:5px 11px;background:var(--ink);color:var(--paper);white-space:nowrap}
.xpbar{flex:1;height:6px;background:var(--rule);position:relative;min-width:90px}
.xpbar i{display:block;height:100%;background:var(--red);transition:width .8s cubic-bezier(.16,1,.3,1)}
.xptext{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.langs{display:flex;border:2px solid var(--ink);margin-right:2px}
.langs button{padding:0 9px;height:32px;font-size:11px;font-weight:700;letter-spacing:.08em;
              background:none;color:var(--ink);border-radius:0;text-transform:uppercase}
.langs button+button{border-left:2px solid var(--ink)}
.langs button.on{background:var(--ink);color:var(--paper)}
.icobtn{width:32px;height:32px;display:grid;place-items:center;background:none;
        border:2px solid var(--ink);font-size:13px;padding:0;color:var(--ink)}
.icobtn:hover{background:var(--ink);color:var(--paper)}
.icobtn.off{opacity:.3}

.stats{display:flex;gap:var(--sp-3);border-top:1px solid var(--rule);padding-top:12px}
.stats>div{min-width:56px}
.stats b{display:block;font-family:var(--disp);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.04em}
.stats span{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.stats .fire b{color:var(--red)}

/* ============================================================
   РЕЖИМ
   ============================================================ */
.modes{display:flex;border:2px solid var(--ink);width:fit-content;margin-bottom:14px}
.modes button{padding:11px 24px;font-size:12px;font-weight:700;letter-spacing:.13em;
              text-transform:uppercase;background:none;color:var(--ink)}
.modes button+button{border-left:2px solid var(--ink)}
.modes button.on{background:var(--ink);color:var(--paper)}
.modehint{font-size:13.5px;color:var(--ink-2);margin-bottom:var(--sp-3);max-width:74ch}

/* ЛЕГЕНДА СЛОЖНОСТИ */
.legend{display:flex;border:3px solid var(--ink);margin-bottom:var(--sp-4);flex-wrap:wrap}
.legend>div{flex:1 1 190px;padding:14px 18px 16px;border-right:3px solid var(--ink);border-top:8px solid var(--lc)}
.legend>div:last-child{border-right:none}
.legend .lt{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--lc);font-weight:700}
.legend .lx{font-family:var(--disp);font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:2px 0 3px}
.legend .ld{font-size:12px;color:var(--ink-2);line-height:1.35}
.legend .lcount{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:7px;letter-spacing:.05em}
@media(max-width:760px){.legend>div{flex:1 1 100%;border-right:none;border-bottom:3px solid var(--ink)}
                        .legend>div:last-child{border-bottom:none}}

/* ============================================================
   ПЛИТКИ ПРЕДМЕТОВ — встык, без зазоров
   ============================================================ */
.tiles{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink)}
.tile{
  position:relative;overflow:hidden;cursor:pointer;min-height:280px;
  background:var(--tbg);color:var(--tink);padding:26px;
  display:flex;flex-direction:column;justify-content:space-between;
  border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
  transition:var(--mid);
}
.tiles .tile:nth-child(2n){border-right:none}
.tiles .tile:nth-child(n+3){border-bottom:none}
.tile-shape{position:absolute;right:-34px;top:-34px;width:210px;height:210px;opacity:.19;
            transition:transform .7s cubic-bezier(.16,1,.3,1),opacity var(--mid)}
.tile:hover .tile-shape{transform:rotate(48deg) scale(1.18);opacity:.34}
.tile-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;opacity:.65;position:relative;z-index:1}
.tile-name{font-family:var(--disp);font-size:clamp(22px,2.9vw,33px);line-height:1.02;
           letter-spacing:-.035em;margin-bottom:12px;position:relative;z-index:1}
.tile-meta{font-family:var(--mono);font-size:12px;opacity:.78;position:relative;z-index:1}
.tile-bar{height:4px;background:rgba(128,128,128,.34);margin-top:14px;position:relative;z-index:1}
.tile-bar i{display:block;height:100%;background:currentColor;transition:width .8s cubic-bezier(.16,1,.3,1)}
.tile.dead{cursor:not-allowed;filter:grayscale(1);opacity:.34}
.tile.dead:hover .tile-shape{transform:none;opacity:.19}
.tile-lock{position:absolute;right:22px;bottom:22px;font-family:var(--mono);font-size:11px;
           letter-spacing:.1em;opacity:.8;z-index:1}

/* ============================================================
   БАННЕР
   ============================================================ */
.banner{border:3px solid var(--ink);padding:26px 28px;margin-bottom:var(--sp-4);position:relative;overflow:hidden}
.banner:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--red)}
.banner .tt{font-family:var(--disp);font-size:clamp(21px,3vw,30px);line-height:1.06;
            letter-spacing:-.03em;margin:10px 0 20px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ============================================================
   БАРАБАН (только на чёрном)
   ============================================================ */
.reelbox{position:relative;overflow:hidden;margin:var(--sp-4) 0;border-top:3px solid #fff;border-bottom:3px solid #fff}
.reelmask{position:relative;overflow:hidden;height:214px}
.reel{display:flex;position:absolute;left:0;top:0;will-change:transform}
.cell{
  width:250px;flex:0 0 250px;height:214px;position:relative;overflow:hidden;padding:20px;
  display:flex;flex-direction:column;justify-content:space-between;
  background:#000;border-right:1px solid #242424;
}
.cell:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:var(--rc)}
.cell .cn{font-family:var(--disp);font-size:17px;font-weight:700;line-height:1.1;letter-spacing:-.025em;color:#fff}
.cell .cr{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.19em;color:var(--rc)}
.cell .clv{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#5e5e5e;margin-bottom:4px}
.cell.locked{opacity:.34}
.cell.locked .cn{color:#8a8a8a}
.cell.locked:before{opacity:.4}
.cell .clock{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:9.5px;
             letter-spacing:.16em;color:var(--rc);border:1px solid var(--rc);padding:2px 6px}

.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--acid);transform:translateX(-50%);z-index:6;
     box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.ptr:before,.ptr:after{content:"";position:absolute;left:50%;transform:translateX(-50%);
                       border:9px solid transparent;}
.ptr:before{top:0;border-top-color:var(--acid)}
.ptr:after{bottom:0;border-bottom-color:var(--acid)}
.fade{position:absolute;top:0;bottom:0;width:140px;z-index:5;pointer-events:none}
.fade.l{left:0;background:linear-gradient(90deg,#000 8%,transparent)}
.fade.r{right:0;background:linear-gradient(-90deg,#000 8%,transparent)}

.won{position:relative;overflow:hidden;padding:44px 34px;margin-top:var(--sp-3);
     border:3px solid var(--rc);animation:pop .55s cubic-bezier(.16,1.4,.3,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.won .rr{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
         color:var(--rc);margin-bottom:16px}
.won .tt{font-family:var(--disp);font-size:clamp(28px,5.6vw,58px);line-height:.97;
         letter-spacing:-.04em;margin-bottom:14px}
.won .xp{font-family:var(--mono);font-size:13px;color:var(--ink-2);margin-bottom:28px}

@keyframes shk{0%,100%{transform:translate(0,0)}12%{transform:translate(-11px,4px)}
  24%{transform:translate(10px,-4px)}36%{transform:translate(-8px,-2px)}48%{transform:translate(7px,3px)}
  60%{transform:translate(-5px,1px)}74%{transform:translate(3px,-1px)}88%{transform:translate(-2px,0)}}
.shake{animation:shk .58s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:var(--fc);opacity:0;animation:fl .5s}
@keyframes fl{0%{opacity:.42}100%{opacity:0}}

/* ============================================================
   МАТЕРИАЛ / ЭКЗАМЕН
   ============================================================ */
.mat{border-top:3px solid var(--ink);padding-top:var(--sp-3);margin-bottom:var(--sp-4);
     column-gap:var(--sp-4);max-width:78ch}
.mat p{margin:0 0 17px;font-size:16.5px;line-height:1.68} .mat p:last-child{margin-bottom:0}
.mat strong{font-weight:700;background:linear-gradient(transparent 62%,var(--acid) 62%)}
.theses{border-left:8px solid var(--red);padding:4px 0 4px 24px;margin-bottom:var(--sp-4);max-width:74ch}

/* ИССЛЕДОВАНИЕ */
.quest{border-top:3px solid var(--ink);margin-bottom:var(--sp-4);max-width:80ch}
.quest .qh{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;
           color:var(--ink-3);margin:14px 0 4px}
.quest ol{margin:0;padding:0;list-style:none;counter-reset:q}
.quest li{counter-increment:q;position:relative;padding:15px 0 15px 52px;border-bottom:1px solid var(--rule);
          font-size:16.5px;line-height:1.45}
.quest li:before{content:counter(q,decimal-leading-zero);position:absolute;left:0;top:15px;
                 font-family:var(--mono);font-size:12px;color:var(--red);font-weight:700;letter-spacing:.08em}
.quest li:last-child{border-bottom:none}
.quest li b{font-weight:600}

.srch{display:flex;flex-wrap:wrap;border:3px solid var(--ink);margin-bottom:var(--sp-3)}
.srch a{flex:1 1 150px;padding:16px 18px;text-decoration:none;color:var(--ink);
        border-right:3px solid var(--ink);transition:var(--fast);display:block}
.srch a:last-child{border-right:none}
.srch a:hover{background:var(--ink);color:var(--paper)}
.srch .sn{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.02em}
.srch .sd{font-size:11.5px;opacity:.7;margin-top:2px}
@media(max-width:760px){.srch a{flex:1 1 100%;border-right:none;border-bottom:3px solid var(--ink)}
                        .srch a:last-child{border-bottom:none}}

.queries{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:var(--sp-4)}
.queries button{border:2px solid var(--rule-2);background:none;color:var(--ink-2);padding:8px 14px;
                font-family:var(--mono);font-size:12px;border-radius:0}
.queries button:hover{border-color:var(--ink);color:var(--ink)}

/* КОНСПЕКТ */
.nbgroup{margin-bottom:var(--sp-4)}
.nbgroup>.gh{font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.03em;
             padding-bottom:8px;border-bottom:3px solid var(--ink);margin-bottom:2px}
.nbrow{border-bottom:1px solid var(--rule);padding:16px 0 16px 16px;border-left:5px solid var(--rc);
       display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.nbrow .t{font-family:var(--disp);font-weight:500;font-size:17px;letter-spacing:-.02em}
.nbrow .m{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:4px;letter-spacing:.05em}
.nbrow .p{font-size:13.5px;color:var(--ink-2);margin-top:8px;max-width:70ch;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peekbox{border:3px dashed var(--rule-2);padding:20px 22px;margin-bottom:var(--sp-4);max-width:74ch}
.peekbox p{margin:0 0 14px;font-size:14px;color:var(--ink-2)}
.theses .h{font-size:11px;text-transform:uppercase;letter-spacing:.19em;font-weight:700;color:var(--ink-3);margin-bottom:14px}
.theses ul{margin:0;padding-left:18px}
.theses li{margin-bottom:10px;font-size:16px}
.theses li::marker{color:var(--red)}
.theses li:last-child{margin-bottom:0}

textarea{width:100%;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
         padding:20px;font:inherit;font-size:16px;line-height:1.65;resize:vertical;min-height:250px;border-radius:0}
textarea:focus{outline:none;border-color:var(--red)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:10px;letter-spacing:.06em}
.count.ok{color:var(--ok)}

pre.prompt{background:var(--paper-2);border-left:8px solid var(--ink);padding:22px;
           white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;
           line-height:1.62;max-height:330px;overflow:auto;color:var(--ink);margin:0 0 var(--sp-2)}
.note{border:2px solid var(--rule-2);padding:18px 22px;font-size:14.5px;color:var(--ink-2);margin-bottom:var(--sp-3);max-width:74ch}
.note b{color:var(--ink)}
.note.warn{border-color:var(--ink);border-left-width:8px}

.grades{display:grid;grid-template-columns:repeat(10,1fr);border:3px solid var(--ink);margin:var(--sp-3) 0;max-width:640px}
.grades button{background:none;color:var(--ink);padding:20px 0;font-family:var(--disp);
               font-weight:700;font-size:19px;border-radius:0}
.grades button+button{border-left:2px solid var(--ink)}
.grades button:hover{background:var(--red);color:#fff}
.grades button.hi:hover{background:var(--acid);color:#0a0a0a}

/* ============================================================
   АРХИВ
   ============================================================ */
.tabs{display:flex;border-bottom:3px solid var(--ink);margin-bottom:var(--sp-3);flex-wrap:wrap}
.tabs button{background:none;color:var(--ink-3);padding:13px 0;margin-right:32px;
             border-bottom:3px solid transparent;margin-bottom:-3px;border-radius:0;
             font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}
.list{border-top:1px solid var(--rule)}
.item{border-bottom:1px solid var(--rule);padding:18px 0 18px 18px;display:flex;
      justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;
      border-left:5px solid var(--rc);transition:var(--fast)}
.item:hover{background:var(--paper-2);padding-left:26px}
.item .nm{font-family:var(--disp);font-weight:500;font-size:17px;letter-spacing:-.02em}
.item .mt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.05em}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:5px 10px;letter-spacing:.1em;white-space:nowrap}
.pill.g{background:var(--acid);color:#0a0a0a}
.empty{color:var(--ink-3);font-size:14px;padding:40px 0;text-align:center}

.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);z-index:99;
       background:var(--ink);color:var(--paper);padding:16px 30px;font-weight:700;font-size:13px;
       letter-spacing:.11em;text-transform:uppercase;opacity:0;pointer-events:none;transition:var(--mid)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.foot{margin-top:var(--sp-6);padding-top:var(--sp-2);border-top:3px solid var(--ink);

<script>


const SUBJECT_ECON = {
  id: "econ",
  name: "Экономика и финансы",
  icon: "₴",
  color: "#4ade80",
  topics: [
    {
      id: "inflation",
      title: "Инфляция: откуда она берётся",
      rarity: "common",
      material: `Инфляция — это не «рост цен». Рост цен это симптом. Инфляция — это падение покупательной способности денег: за ту же купюру ты завтра получаешь меньше товара, чем сегодня.

**Три механизма, которые её запускают.**

Первый — инфляция спроса. Денег на руках у людей больше, чем товаров на полках. Классический пример: государство раздало выплаты, производство при этом не выросло. Больше денег гонятся за тем же количеством товара — продавец поднимает цену, потому что может.

Второй — инфляция издержек. Подорожало сырьё, энергия, логистика или труд. Производитель перекладывает рост себестоимости в цену. Нефтяные шоки 1973 года — учебниковый случай: цены выросли при падающем производстве.

Третий — инфляционные ожидания, и это самый коварный механизм. Если все уверены, что через год всё подорожает на 20%, продавцы поднимают цены заранее, работники требуют повышения зарплат заранее, и ожидание сбывается само по себе. Инфляция становится самоподдерживающейся. Именно поэтому центробанки так помешаны на «заякоривании ожиданий» — их задача не столько управлять ценами, сколько управлять верой людей в будущие цены.

**Уравнение обмена.** Формула Фишера: MV = PQ. Денежная масса, умноженная на скорость обращения денег, равна уровню цен, умноженному на объём производства. Отсюда монетаристский вывод Милтона Фридмана: если M растёт быстрее Q, растёт P. Но формула лукавая — V (скорость обращения) нестабильна. После 2008 года центробанки залили в экономику триллионы, а инфляции не случилось: деньги осели в резервах банков, скорость обращения рухнула. Это важный контраргумент против упрощённого монетаризма.

**Почему нулевая инфляция — плохая цель.** Цель большинства центробанков — около 2%, а не 0%. Причины: во-первых, дефляция страшнее инфляции (если деньги дорожают, покупки откладывают, спрос падает, экономика сжимается — Япония 1990-х); во-вторых, небольшая инфляция позволяет «незаметно» снижать реальные зарплаты в кризис вместо массовых увольнений; в-третьих, она даёт центробанку пространство для снижения ставки.

**Инструмент подавления.** Главный — ключевая ставка. Поднимая её, ЦБ делает кредит дорогим, а сбережения выгодными. Люди меньше тратят, спрос падает, цены тормозят. Цена лечения — замедление экономики и рост безработицы. Это всегда компромисс, а не бесплатное решение.`,
      theses: [
        "Инфляция — падение покупательной способности денег, а не просто рост цен",
        "Три механизма: инфляция спроса, инфляция издержек, инфляционные ожидания",
        "Ожидания самосбываются — поэтому ЦБ управляет верой людей в будущие цены",
        "Уравнение Фишера MV=PQ и его слабое место — нестабильная скорость обращения V",
        "Цель ~2%, а не 0%, потому что дефляция опаснее: спрос откладывается, экономика сжимается",
        "Главный инструмент — ключевая ставка, цена лечения — замедление роста и безработица"
      ]
    },
    {
      id: "supply-demand",
      title: "Спрос, предложение и эластичность",
      rarity: "common",
      material: `Базовая модель: кривая спроса идёт вниз (чем дороже, тем меньше берут), кривая предложения вверх (чем дороже, тем больше готовы произвести). Точка пересечения — равновесная цена. Это все знают. Интересное начинается дальше — в эластичности.

**Эластичность — это чувствительность.** Насколько сильно изменится спрос, если цена вырастет на 1%. Если спрос падает больше чем на 1% — товар эластичный. Меньше — неэластичный.

Неэластичные товары: инсулин, бензин, соль, хлеб, коммунальные услуги. Цена выросла вдвое — берут почти столько же, потому что альтернативы нет или доля в бюджете мала. Эластичные: конкретная марка кофе, авиабилеты на отдых, рестораны, любой товар с близким заменителем.

**Практический вывод, который переворачивает интуицию.** Поднимать цену выгодно только на неэластичном товаре. На эластичном рост цены на 10% может обрушить продажи на 30% — выручка упадёт. Именно поэтому фармкомпании спокойно поднимают цены на уникальные лекарства, а производитель обычной газировки не может: рядом на полке стоит конкурент.

**Что делает спрос эластичным.** Наличие заменителей — главный фактор. Доля в бюджете: соль подорожала втрое, ты не заметил. Время: в короткой перспективе спрос на бензин неэластичен (машина уже куплена), в долгой — эластичен (пересядешь на другую или переедешь ближе к работе). Необходимость против роскоши.

**Кто платит налог.** Красивое следствие: налог на товар ложится на ту сторону рынка, которая менее эластична. Если покупатели не могут отказаться (сигареты, топливо) — налог платят они, продавец просто добавит его к цене. Если покупатели легко уйдут — налог съест маржу продавца. Поэтому акцизы вешают именно на неэластичные товары: собираемость высокая, поведение почти не меняется.

**Ловушка модели.** Кривые спроса и предложения предполагают, что покупатель рационален и информирован. Реальность сложнее: эффект Веблена (спрос растёт с ценой, потому что цена — сигнал статуса), эффект Гиффена, привычки, бренд как заменитель информации о качестве. Модель — рабочий скелет, а не описание реальности.`,
      theses: [
        "Равновесная цена — пересечение кривых спроса и предложения",
        "Эластичность = чувствительность спроса к изменению цены",
        "Поднимать цену выгодно только на неэластичном товаре, иначе выручка падает",
        "Эластичность определяют: заменители, доля в бюджете, время, необходимость",
        "Налог ложится на менее эластичную сторону рынка — отсюда акцизы на сигареты и топливо",
        "Модель ломается на эффекте Веблена и нерациональном поведении"
      ]
    },
    {
      id: "game-theory",
      title: "Теория игр и равновесие Нэша",
      rarity: "rare",
      material: `Теория игр изучает ситуации, где твой результат зависит не только от твоего решения, но и от решения другого — и наоборот. Это математика стратегического взаимодействия.

**Дилемма заключённого.** Двоих подельников допрашивают отдельно. Молчат оба — по 1 году каждому. Сдаёт один — он выходит на свободу, второй получает 10 лет. Сдают оба — по 5 лет. Разбираем логику: если напарник молчит, мне выгодно сдать (0 вместо 1). Если напарник сдаёт, мне тоже выгодно сдать (5 вместо 10). Сдавать выгодно всегда, независимо от его выбора. То же самое рассуждает он. Итог — оба сдают, оба получают по 5 лет, хотя молчание дало бы по 1 году.

Ключевой вывод: **рациональное поведение каждого приводит к худшему результату для всех**. Это ломает наивную веру в то, что рынок сам всё оптимизирует.

**Равновесие Нэша.** Такая комбинация стратегий, при которой ни одному игроку не выгодно менять свою стратегию в одиночку. «Оба сдают» — равновесие Нэша. Заметь: равновесие не значит «хорошо». Оно значит «стабильно». Из плохого равновесия нельзя выбраться односторонним действием — нужен внешний механизм: контракт, закон, репутация.

**Где это встречается в жизни.** Гонка вооружений — обеим странам лучше не тратиться, но каждой по отдельности выгодно вооружаться. Ценовые войны — обеим компаниям лучше держать высокую цену, но каждой выгодно демпинговать первой. Допинг в спорте. Реклама: если никто не рекламируется, все экономят; если один начал, вынуждены все. Загрязнение окружающей среды. Переработки в офисе.

**Как выбраться.** Повторяющаяся игра меняет всё. Если игра идёт один раз — предавай. Если бесконечно — сотрудничество становится рациональным, потому что предательство будет наказано в следующих раундах. Роберт Аксельрод провёл турнир стратегий, и победила простейшая — «око за око» (tit for tat): начинай с сотрудничества, дальше повторяй последний ход соперника. Она добрая (не предаёт первой), мстительная (наказывает сразу), прощающая (возвращается к сотрудничеству) и понятная.

Отсюда практический вывод: репутация и долгие отношения — не мораль, а экономический механизм. Они превращают одноразовую игру в повторяющуюся.`,
      theses: [
        "Теория игр — про ситуации, где результат зависит от решений обеих сторон",
        "Дилемма заключённого: сдать выгодно при любом ходе соперника, итог хуже для обоих",
        "Рациональность каждого может дать худший результат для всех",
        "Равновесие Нэша — состояние, где никому не выгодно менять стратегию в одиночку; стабильно ≠ хорошо",
        "Примеры: гонка вооружений, ценовые войны, допинг, реклама, переработки",
        "Повторяющаяся игра делает сотрудничество рациональным; победная стратегия — 'око за око'"
      ]
    },
    {
      id: "kahneman",
      title: "Две системы мышления по Канеману",

let S = load();
function sysTheme(){
  try{ return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }catch(e){ return "light"; }

function norm(o){
  o = o || {};
  return {
    v:2,
    active:  o.active  || null,
    learned: o.learned && typeof o.learned==="object" ? o.learned : {},
    attempts:o.attempts|| {},
    answers: o.answers || {},
    xp:      +o.xp     || 0,
    streak:  +o.streak || 0,
    best:    +o.best   || 0,
    mode:    o.mode==="hard" ? "hard" : "ladder",
    sound:   o.sound !== false,
    theme:   o.theme==="dark" || o.theme==="light" ? o.theme : sysTheme(),
    peeked:  o.peeked && typeof o.peeked==="object" ? o.peeked : {},
    lang:    I18N[o.lang] ? o.lang : detectLang(),
    notes:   o.notes && typeof o.notes==="object" ? o.notes : {},
    hf:      (o.hf && typeof o.hf==="object")
               ? {lo:+o.hf.lo||HIST_MIN, hi:+o.hf.hi||HIST_MAX, r:Array.isArray(o.hf.r)?o.hf.r:[]}
               : {lo:HIST_MIN, hi:HIST_MAX, r:[]}
  };
}
function load(){
  try{ const r = JSON.parse(localStorage.getItem(KEY)); if(r && r.v===2) return norm(r); }catch(e){}
  try{ /* миграция со старой версии */
    const old = JSON.parse(localStorage.getItem("topic-roulette-v1"));
    if(old && old.v===1) return norm(old);
  }catch(e){}
  return norm(null);
}

function k(sid,tid){ return sid+":"+tid; }
function allTopics(){ const a=[]; SUBJECTS.forEach(s=>s.topics.forEach(t=>a.push({s,t}))); return a; }
function findT(sid,tid){ const s=SUBJECTS.find(x=>x.id===sid); if(!s) return null; const t=s.topics.find(x=>x.id===tid); return t?{s,t}:null; }
function isLearned(sid,tid){ return !!S.learned[k(sid,tid)]; }
function isActive(sid,tid){ return S.active && S.active.sid===sid && S.active.tid===tid; }
function learnedIn(sid){ return Object.keys(S.learned).filter(x=>x.split(":")[0]===sid).length; }
function maxLvl(sid){ const n=learnedIn(sid); return n>=L3_AT ? 3 : n>=L2_AT ? 2 : 1; }
function daysSince(ts){ return Math.floor((Date.now()-ts)/864e5); }

/* Фильтр истории: период и регионы. Пустой список регионов = все.
   Если фильтр обнуляет барабан, он игнорируется — лучше выдать тему,
   чем оставить человека с пустым экраном. */
function histFilterOn(){
  return !!(S.hf && (S.hf.lo>HIST_MIN || S.hf.hi<HIST_MAX || (S.hf.r&&S.hf.r.length)));
}
function passHist(t){
  if(!S.hf) return true;
  if(t.y < S.hf.lo || t.y > S.hf.hi) return false;
  if(S.hf.r && S.hf.r.length && !(t.r||[]).some(x=>S.hf.r.indexOf(x)>=0)) return false;
  return true;
}
/* пул с учётом режима: в 'ladder' закрытые уровни не участвуют */
function pool(sid){
  const s = SUBJECTS.find(x=>x.id===sid);
  const cap = S.mode==="hard" ? 3 : maxLvl(sid);
  const base = s.topics.filter(t=>!isLearned(sid,t.id) && !isActive(sid,t.id) && t.lvl<=cap);
  if(sid!=="hist" || !histFilterOn()) return base;
  const cut = base.filter(passHist);
  return cut.length ? cut : base;
}
/* сколько тем останется под текущим фильтром — для счётчика в интерфейсе */
function histCut(){
  const cap = S.mode==="hard" ? 3 : maxLvl("hist");
  const base = SUBJECTS.find(x=>x.id==="hist").topics
    .filter(t=>!isLearned("hist",t.id) && !isActive("hist",t.id) && t.lvl<=cap);
  return {n: base.filter(passHist).length, total: base.length};
}
function lockedCount(sid){
  const s = SUBJECTS.find(x=>x.id===sid), cap = maxLvl(sid);
  return s.topics.filter(t=>!isLearned(sid,t.id) && t.lvl>cap).length;
}

/* Шкала подобрана под реальный банк опыта: 218 тем дают ~6200 XP при минимальной
   сдаче на 7 и ~7500 при средней 8. Полное прохождение выводит примерно на 18-20 уровень. */
function needFor(lvl){ return 100 + (lvl-1)*32; }
function levelInfo(){
  let lvl=1, left=S.xp;
  while(left >= needFor(lvl)){ left -= needFor(lvl); lvl++; }
  return {lvl, cur:left, need:needFor(lvl)};
}

function b64enc(str){
  const b=new TextEncoder().encode(str); let s=""; const CH=0x8000;
  for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
  return btoa(s);
}
function b64dec(s){
  const bin=atob(s.replace(/\s+/g,"")); const b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

    + " · "+S.xp+" XP · "+esc(L("syncStreak"))+" "+S.streak
    + (S.active?esc(L("syncHasActive")):esc(L("syncNoActive")));

let AC=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq,dur,type,vol){
  if(!S.sound) return; const c=ac(); if(!c) return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||.05,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}

  const sets={common:[392,523],rare:[392,523,659],epic:[392,523,659,784,1047]};
  (sets[rarity]||sets.common).forEach((f,i)=>setTimeout(()=>beep(f,.5,"triangle",.09),i*95));
}

const cv=document.getElementById("fx"); const cx=cv.getContext("2d");
let parts=[], raf=null;
function fitCanvas(){ cv.width=innerWidth; cv.height=innerHeight; }
fitCanvas(); addEventListener("resize",fitCanvas);
function confetti(color,count){
  const n = count||90;
  for(let i=0;i<n;i++){
    parts.push({
      x:innerWidth/2 + (Math.random()-.5)*260,
      y:innerHeight*0.36,
      vx:(Math.random()-.5)*13, vy:-Math.random()*15-4,
      w:4+Math.random()*7, h:5+Math.random()*9,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*.36,
      col: Math.random()<.62 ? color : (Math.random()<.5?"#ffffff":"#ffe08a"),
      life:1
    });
  }
  if(!raf) raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    p.vy+=.42; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=.995; p.life-=.0062;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.col;
    cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
  });
  parts = parts.filter(p=>p.life>0 && p.y<cv.height+60);
  if(parts.length) raf=requestAnimationFrame(loop);
  else { cx.clearRect(0,0,cv.width,cv.height); raf=null; }
}
function shake(){ const w=document.querySelector(".wrap"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); }
function flash(color){
  const d=document.createElement("div"); d.className="flash"; d.style.setProperty("--fc",color);
  document.body.appendChild(d); setTimeout(()=>d.remove(),560);
}

function cellHTML(t, locked){
  const r = RAR[t.rarity]||RAR.common;
  return '<div class="cell'+(locked?" locked":"")+'" style="--rc:'+r.c+'">'
    + (locked?'<div class="clock">'+L("closedCell")+'</div>':'')
    + '<div class="cn">'+esc(TT(t))+'</div>'
    + '<div><div class="clv">+'+r.xp+' XP</div><div class="cr">'+r.n+'</div></div></div>';
}
/* Полоса барабана. Доступные темы перемешаны с закрытыми — закрытые показаны
   затемнёнными и выпасть не могут, они нужны чтобы было видно, что ждёт впереди.
   Две одинаковые темы подряд не ставим: выглядит как сбой. */
function buildReel(winner){
  const sid = curSubj.id;
  const p = pool(sid);
  const cap = S.mode==="hard" ? 3 : maxLvl(sid);
  const teasers = curSubj.topics.filter(t=>!isLearned(sid,t.id) && !isActive(sid,t.id) && t.lvl>cap);
  const TEASE = teasers.length ? 0.3 : 0;
  const strip=[], WIN_AT=60;
  let prev=null;
  const pick = a => a[Math.floor(Math.random()*a.length)];

  for(let i=0;i<76;i++){
    if(winner && i===WIN_AT){ strip.push({t:winner,lock:false}); prev=winner; continue; }
    /* источник выбираем один раз, иначе повторный бросок при дубле перекашивает долю */
    const lock = TEASE>0 && Math.random()<TEASE;
    const src = lock ? teasers : p;
    if(!src.length) continue;
    let t = pick(src), guard=0;
    while(prev && t.id===prev.id && src.length>1 && guard++<8) t = pick(src);
    strip.push({t,lock}); prev=t;
  }

  const r = document.getElementById("reel");
  r.style.transition="none"; r.style.transform="translateX(0px)";
  r.innerHTML = strip.map(c=>cellHTML(c.t,c.lock)).join("");
  void r.offsetWidth;
  return WIN_AT;
}
function cellW(){ return window.innerWidth<=760 ? 186 : 250; }
function spin(){
  if(spinning) return;
  const p = pool(curSubj.id);
  if(!p.length){ toast(L("drumEmpty")); return; }
  ac();
  spinning = true;
  const btn=document.getElementById("spin-btn");
  btn.disabled=true; btn.textContent=L("spinning");
  document.getElementById("reelbox").classList.add("live");

  const winner = p[Math.floor(Math.random()*p.length)];
  const idx = buildReel(winner);
  const cw = cellW(), box = document.querySelector(".reelmask").offsetWidth;
  const jitter = (Math.random()-.5)*(cw-30)*.55;
  const target = -(idx*cw + cw/2 - box/2 + jitter);
  const reel = document.getElementById("reel");

  requestAnimationFrame(()=>{
    reel.style.transition="transform var(--spin)";
    reel.style.transform="translateX("+target+"px)";
  });

  /* тиканье по проезжающим ячейкам */
  let last=-1;
  (function watch(){
    try{
      const tr = getComputedStyle(reel).transform;
      if(tr && tr!=="none"){
        const m = new DOMMatrixReadOnly(tr);
        const i = Math.round((-m.m41 + box/2)/cw);
        if(i!==last){ last=i; tick(); }
      }
    }catch(e){}
    if(spinning) tickRaf=requestAnimationFrame(watch);
  })();

  setTimeout(()=>{
    spinning=false; if(tickRaf) cancelAnimationFrame(tickRaf);
    showWon(winner);
  }, 5500);
}
function showWon(t){
  const r = RAR[t.rarity]||RAR.common;
  chord(t.rarity);
  if(t.rarity!=="common"){ shake(); flash(r.raw); confetti(r.raw, t.rarity==="epic"?170:90); }
  document.getElementById("won").innerHTML =
    '<div class="won" style="--rc:'+r.c+'"><div class="rr">'+r.n+' · '+L("levelIs")+' '+t.lvl+'</div>'
    + '<div class="tt">'+esc(TT(t))+'</div>'
    + '<div class="xp">+'+xpFor(t.rarity,PASS,S.streak+1,false)+'…'+xpFor(t.rarity,10,S.streak+1,false)+' '+L("xpDepends")+'</div>'
    + '<button class="btn big acid" onclick="take(\''+curSubj.id+'\',\''+t.id+'\')">'+L("take")+'</button></div>';
  document.getElementById("won").scrollIntoView({behavior:"smooth",block:"nearest"});
}

const PEEK_MULT = 0.6;

/* что уже сдано в этом предмете — чтобы подталкивать связывать новое со старым */
function knownIn(sid, limit){
  return Object.keys(S.learned).filter(x=>x.split(":")[0]===sid)
    .map(x=>{ const f=findT(sid,x.split(":")[1]); return f?TT(f.t):null; })
    .filter(Boolean).slice(0,limit||14);
}

function searchLinks(f){
  const q = encodeURIComponent(TT(f.t));
  const qc= encodeURIComponent(TT(f.t)+" "+L("qCritique"));
  return [
    [L("srcGoogle"), L("srcGoogleD"), "https://www.google.com/search?q="+q],
    [L("srcSchol"),  L("srcScholD"),  "https://scholar.google.com/scholar?q="+q],
    [L("srcVideo"),  L("srcVideoD"),  "https://www.youtube.com/results?search_query="+q],
    [L("srcCrit"),   L("srcCritD"),   "https://www.google.com/search?q="+qc]
  ];
}
function queryList(f){
  const t = TT(f.t);
  return [t, t+" "+L("qSimple"), t+" "+L("qExamples"), t+" "+L("qWho"), t+" "+L("qCritique"), t+" "+L("qLimits")];
}
function questions(f){
  const known = knownIn(f.s.id, 4);
  return [
    L("q1a")+" <b>«"+esc(TT(f.t))+"»</b> "+L("q1b"),
    L("q2"), L("q3"), L("q4"), L("q5"),
    known.length ? L("q6known")+" "+esc(known.join(", "))+"." : L("q6new"),
    L("q7"),
    L("q8"+f.s.id) || L("q8psy")
  ];
}

/* ============================================================
   РЕЗУЛЬТАТ
   ============================================================ */
/* ------------------------------------------------------------
   Начисление опыта. Три множителя, каждый со своим смыслом:
     база     — сложность темы (10 / 25 / 50)
     оценка   — качество ответа: 7 даёт базу, каждый балл сверху +20%
     стрик    — серия без провалов: +5% за шаг, потолок +50%
   Максимум за одну тему: 50 × 1.6 × 1.5 = 120 XP.
   ------------------------------------------------------------ */
function gradeMult(n){ return 1 + (n-PASS)*0.2; }
function streakMult(st){ return 1 + Math.min(Math.max(st-1,0),10)*0.05; }
function xpFor(rarity,n,st,peeked){
  return Math.round(RAR[rarity].xp * gradeMult(n) * streakMult(st) * (peeked?PEEK_MULT:1));
}

function grade(n){
  const key=k(S.active.sid,S.active.tid), f=findT(S.active.sid,S.active.tid), r=RAR[f.t.rarity];
  S.attempts[key]=(S.attempts[key]||0)+1;
  const passed = n>=PASS;
  let gained=0, parts="", lvlBefore=levelInfo().lvl;

  if(passed){
    S.streak += 1;
    if(S.streak>S.best) S.best=S.streak;
    const peeked = !!S.peeked[key];
    gained = xpFor(f.t.rarity, n, S.streak, peeked);
    const gm=gradeMult(n), sm=streakMult(S.streak);
    parts = r.xp+" "+L("pBase")
          + (gm>1 ? " × "+gm.toFixed(1)+" "+L("pGrade") : "")
          + (sm>1 ? " × "+sm.toFixed(2)+" "+L("pStreak") : "")
          + (peeked ? " × "+PEEK_MULT+" "+L("pPeek") : "");
    S.xp += gained;
    /* запись в конспект: собственный ответ + разбор от Клода */
    const fb = (document.getElementById("feedback").value||"").trim();
    S.notes[key] = { a:(S.answers[key]||"").trim(), f:fb, g:n, at:Date.now(),
                     xp:gained, att:S.attempts[key], peeked:peeked };
    S.learned[key]={grade:n, at:Date.now(), attempts:S.attempts[key], xp:gained, peeked:peeked};
    S.active=null; delete S.answers[key]; delete S.peeked[key];
  } else { S.streak = 0; }
  save();

  const lvlAfter=levelInfo().lvl, levelUp = lvlAfter>lvlBefore;
  const box=document.getElementById("res-box");
  box.style.setProperty("--rc", passed ? "var(--ok)" : "var(--bad)");

  if(passed){
    chord(f.t.rarity); shake(); flash(r.raw); confetti(r.raw, f.t.rarity==="epic"?200:120);
    box.innerHTML = '<div class="rr" style="color:var(--ok)">'+L("passed")+' · '+n+'/10</div>'
      + '<div class="tt">'+esc(TT(f.t))+'</div>'
      + '<div class="xp">+'+gained+' XP  ·  '+parts+(levelUp?"  ·  "+L("newLevel")+" "+lvlAfter:"")+'</div>'
      + '<p class="sub" style="margin:0 0 22px">'+L("passText1")+' '+REPEAT_DAYS+' '+L("passText2")+'</p>'
      + '<button class="btn big" onclick="go(\'home\')">'+L("next")+'</button>';
    if(levelUp) setTimeout(()=>{ confetti("#ffb020",180); chord("epic"); }, 700);
  } else {
    sadSound();
    box.innerHTML = '<div class="rr" style="color:var(--bad)">'+L("failed")+' · '+n+'/10</div>'
      + '<div class="tt">'+esc(TT(f.t))+'</div>'
      + '<div class="xp" style="color:var(--bad)">'+L("streakReset")+'</div>'
      + '<p class="sub" style="margin:0 0 22px">'+L("failText")+'</p>'
      + '<div class="row" style="justify-content:center"><button class="btn" onclick="go(\'study\')">'+L("toMaterial")+'</button>'
      + '<button class="btn2" onclick="go(\'exam\')">'+L("retryNow")+'</button></div>';
  }
  go("res");
}

let curTab="learned";
function tab(name){
  curTab=name;
  ["learned","repeat","todo"].forEach(t=>document.getElementById("tab-"+t).classList.toggle("on",t===name));
  const box=document.getElementById("arch-list"); let rows=[];

  if(name==="learned"){
    rows = Object.entries(S.learned).map(([key,v])=>{
      const [sid,tid]=key.split(":"), f=findT(sid,tid); if(!f) return null;
      return {f, right:'<span class="pill g">'+v.grade+'/10</span>',
        meta:f.s.name+" · "+L("legLvl").toLowerCase()+" "+f.t.lvl+" · "
             +(daysSince(v.at)===0?L("today"):daysSince(v.at)+" "+L("daysAgo"))
             +(v.attempts>1?" "+L("withAttempts")+" "+v.attempts+" "+L("attemptsWord"):"")
             +(v.peeked?" "+L("withPeek"):"")};
    }).filter(Boolean).sort((a,b)=>a.f.s.name.localeCompare(b.f.s.name));
  }
  if(name==="repeat"){
    rows = Object.entries(S.learned).filter(([_,v])=>daysSince(v.at)>=REPEAT_DAYS).map(([key,v])=>{
      const [sid,tid]=key.split(":"), f=findT(sid,tid); if(!f) return null;
      return {f, right:'<button class="btn2" onclick="retake(\''+sid+'\',\''+tid+'\')">'+L("repeatBtn")+'</button>',
        meta:f.s.name+" · "+L("passedOn")+" "+daysSince(v.at)+" "+L("daysAgo")+" "+L("onGrade")+" "+v.grade+"/10"};
    }).filter(Boolean);
  }
  if(name==="todo"){
    const cap={}; SUBJECTS.forEach(s=>cap[s.id]= S.mode==="hard"?3:maxLvl(s.id));
    rows = allTopics().filter(({s,t})=>!isLearned(s.id,t.id)&&!isActive(s.id,t.id)).map(({s,t})=>{
      const r=RAR[t.rarity]||RAR.common, lock = t.lvl>cap[s.id];
      return {f:{s,t}, right:'<span class="pill" style="background:none;color:'+(lock?"var(--ink-3)":r.c)+'">'+(lock?"🔒 "+t.lvl:r.n)+'</span>',
        meta:s.name+" · "+L("levelIs")+" "+t.lvl};
    });
  }

  box.innerHTML = rows.length ? rows.map(r=>
    '<div class="item" style="--rc:'+(RAR[r.f.t.rarity]||RAR.common).c+'"><div><div class="nm">'+esc(TT(r.f.t))+'</div>'
    + '<div class="mt">'+esc(r.meta)+'</div></div>'+r.right+'</div>').join("")
    : '<div class="empty">'+(name==="learned"?L("emptyLearned"):name==="repeat"?L("emptyRepeat"):L("emptyTodo"))+'</div>';
}
function retake(sid,tid){
  if(S.active){ toast(L("closeFirst")); return; }
  delete S.learned[k(sid,tid)]; delete S.attempts[k(sid,tid)]; delete S.peeked[k(sid,tid)];
  S.active={sid,tid,at:Date.now()}; save(); go("study");
}

function wipe(){
  if(!confirm(L("wipeConfirm"))) return;
  S = norm({mode:S.mode, sound:S.sound, theme:S.theme, lang:S.lang});
  save(); go("home");
}

function pname(p){ return S.lang==="uk"?p[1]:S.lang==="en"?p[2]:p[0]; }

var ST=[[HIST_MIN,0],[-1000,.2],[500,.38],[1500,.6],[1800,.75],[1900,.86],[HIST_MAX,1]];
function y2p(y){ for(var i=0;i<ST.length-1;i++){var a=ST[i],b=ST[i+1];if(y<=b[0])return a[1]+(y-a[0])/(b[0]-a[0])*(b[1]-a[1]);} return 1; }
function p2y(p){ for(var i=0;i<ST.length-1;i++){var a=ST[i],b=ST[i+1];if(p<=b[1])return Math.round(a[0]+(p-a[1])/(b[1]-a[1])*(b[0]-a[0]));} return HIST_MAX; }

var box=null,cv=null,ctx=null,d3ok=false,proj=null,gpath=null;
var rotL=-20,rotP=-14,land=null,gd=null,moved=0,drag=null,spin=null;

function eras(){
  var a=ERAS.filter(function(e){ return e.y>=S.hf.lo && e.y<=S.hf.hi; });
  if(!a.length){ var mid=(y2p(S.hf.lo)+y2p(S.hf.hi))/2,bd=1e12,b=ERAS[0];
    ERAS.forEach(function(e){ var d=Math.abs(y2p(e.y)-mid); if(d<bd){bd=d;b=e;} }); a=[b]; }
  return a;
}
function powers(){ var seen={},out=[];
  eras().forEach(function(e){ e.e.forEach(function(p){ if(!seen[p[0]]){seen[p[0]]=1;out.push(p);} }); });
  return out; }

function initD3(){
  if(typeof d3==="undefined"||!d3.geoOrthographic||!ctx) return false;
  proj=d3.geoOrthographic().scale(244).translate([260,260]).clipAngle(90);
  gpath=d3.geoPath(proj,ctx); d3ok=true; return true;
}
function globe(){
  if(!ctx) return;
  if(!d3ok && !initD3()) return;
  var cs=getComputedStyle(document.body);
  var ink=cs.getPropertyValue("--ink")||"#111", rule=cs.getPropertyValue("--rule-2")||"#bbb";
  var acid=cs.getPropertyValue("--acid")||"#c6f135", paper=cs.getPropertyValue("--paper")||"#fff";
  proj.rotate([rotL,rotP]);
  ctx.clearRect(0,0,520,520);
  ctx.beginPath(); gpath({type:"Sphere"}); ctx.fillStyle=paper; ctx.fill();
  ctx.strokeStyle=ink; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath(); gpath(d3.geoGraticule10()); ctx.strokeStyle=rule; ctx.globalAlpha=.5; ctx.lineWidth=.7; ctx.stroke(); ctx.globalAlpha=1;
  if(land){
    ctx.beginPath(); gpath(land); ctx.fillStyle=ink; ctx.globalAlpha=.13; ctx.fill(); ctx.globalAlpha=1;
    ctx.beginPath(); gpath(land); ctx.strokeStyle=ink; ctx.globalAlpha=.55; ctx.lineWidth=1; ctx.stroke(); ctx.globalAlpha=1;
  }
  var list=powers();
  list.forEach(function(p){
    var on=S.hf.r.indexOf(p[6])>=0;
    ctx.beginPath(); gpath(d3.geoCircle().center([p[4],p[3]]).radius(p[5])());
    ctx.fillStyle=on?acid:ink; ctx.globalAlpha=on?.5:.09; ctx.fill();
    ctx.globalAlpha=on?1:.32; ctx.strokeStyle=ink; ctx.lineWidth=on?2.5:1; ctx.stroke(); ctx.globalAlpha=1;
  });
  list.forEach(function(p){
    var on=S.hf.r.indexOf(p[6])>=0, c=proj([p[4],p[3]]);
    if(!c||d3.geoDistance([p[4],p[3]],[-rotL,-rotP])>=Math.PI/2) return;
    ctx.font=(on?"700 ":"500 ")+"14px sans-serif"; ctx.textAlign="center";
    ctx.lineWidth=4; ctx.strokeStyle=paper; ctx.strokeText(pname(p),c[0],c[1]+4);
    ctx.fillStyle=ink; ctx.fillText(pname(p),c[0],c[1]+4);
  });
}
function toggleRegion(id){
  var i=S.hf.r.indexOf(id);
  if(i>=0) S.hf.r.splice(i,1); else S.hf.r.push(id);
  save(); render();
}
function render(){
  if(!box) return;
  var a=y2p(S.hf.lo)*100,b=y2p(S.hf.hi)*100;
  document.getElementById("hfSel").style.left=a+"%";
  document.getElementById("hfSel").style.width=(b-a)+"%";
  document.getElementById("hfA").style.left=a+"%";
  document.getElementById("hfB").style.left=b+"%";
  document.getElementById("hfYr").textContent=yl(S.hf.lo)+" — "+yl(S.hf.hi);
  document.getElementById("hfEra").textContent=X("era")+": "+eras().map(nm).join(" · ");
  document.getElementById("hfPw").innerHTML=powers().map(function(p){
    var on=S.hf.r.indexOf(p[6])>=0;
    return '<button class="'+(on?"on":"")+'" data-r="'+p[6]+'">'+pname(p)+'</button>'; }).join("");
  document.getElementById("hfRg").innerHTML=REGIONS.map(function(r){
    var on=S.hf.r.indexOf(r.id)>=0;
    return '<button class="'+(on?"on":"")+'" data-r="'+r.id+'">'+nm(r)+'</button>'; }).join("");
  var c=histCut();
  document.getElementById("hfCnt").textContent=c.n+" "+X("of")+" "+c.total;
  document.getElementById("hfCntL").textContent=X("inDrum");
  globe();
}
function wire(){
  var tk=document.getElementById("hfTk");
  function px(e){ var r=tk.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX);
    return Math.max(0,Math.min(1,(x-r.left)/r.width)); }
  function grab(e){ var p=px(e);
    drag=Math.abs(p-y2p(S.hf.lo))<=Math.abs(p-y2p(S.hf.hi))?"lo":"hi"; mv(e); }
  function mv(e){ if(!drag)return; var y=p2y(px(e));
    if(drag==="lo") S.hf.lo=Math.min(y,S.hf.hi-20); else S.hf.hi=Math.max(y,S.hf.lo+20);
    save(); render(); if(e.preventDefault)e.preventDefault(); }
  tk.addEventListener("mousedown",grab); tk.addEventListener("touchstart",grab,{passive:false});
  window.addEventListener("mousemove",mv); window.addEventListener("touchmove",mv,{passive:false});
  window.addEventListener("mouseup",function(){drag=null;});
  window.addEventListener("touchend",function(){drag=null;});

  cv.addEventListener("mousedown",function(e){ gd=[e.clientX,e.clientY]; moved=0; cv.style.cursor="grabbing"; });
  window.addEventListener("mousemove",function(e){ if(!gd)return;
    var dx=e.clientX-gd[0],dy=e.clientY-gd[1]; moved+=Math.abs(dx)+Math.abs(dy);
    rotL+=dx*0.35; rotP=Math.max(-80,Math.min(80,rotP-dy*0.35)); gd=[e.clientX,e.clientY]; globe(); });
  window.addEventListener("mouseup",function(){ gd=null; if(cv) cv.style.cursor="grab"; });
  cv.addEventListener("click",function(e){ if(moved>6||!d3ok)return;
    var r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*520,my=(e.clientY-r.top)/r.height*520;
    var best=null,bd=1e9;
    powers().forEach(function(p){ var c=proj([p[4],p[3]]); if(!c)return;
      if(d3.geoDistance([p[4],p[3]],[-rotL,-rotP])>=Math.PI/2)return;
      var d=Math.sqrt((c[0]-mx)*(c[0]-mx)+(c[1]-my)*(c[1]-my)); if(d<bd){bd=d;best=p;} });
    if(best&&bd<62) toggleRegion(best[6]); });

  document.getElementById("hfPw").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(b) toggleRegion(b.getAttribute("data-r")); });
  document.getElementById("hfRg").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(b) toggleRegion(b.getAttribute("data-r")); });
  document.getElementById("hfRst").addEventListener("click",function(){
    S.hf={lo:HIST_MIN,hi:HIST_MAX,r:[]}; save(); render(); });
}
function build(){
  box=document.createElement("div"); box.className="hfx";
  box.innerHTML=
    '<div class="hh"><div><div class="eyebrow">'+X("title")+'</div>'+
    '<div class="cntl" id="hfEra">—</div></div><div class="yr" id="hfYr">—</div></div>'+
    '<div class="tk" id="hfTk"><div class="bar"></div><div class="sel" id="hfSel"></div>'+
    '<div class="kn" id="hfA"></div><div class="kn" id="hfB"></div></div>'+
    '<div class="tks" id="hfTks"></div>'+
    '<div class="body">'+
      '<div><canvas id="hfCv" width="520" height="520"></canvas>'+
      '<div class="cap" style="text-align:center">'+X("drag")+'</div></div>'+
      '<div><div class="cap">'+X("powers")+'</div><div class="chips" id="hfPw"></div>'+
      '<div class="chips" id="hfRg"></div>'+
      '<div class="cnt" id="hfCnt">—</div><div class="cntl" id="hfCntL">—</div>'+
      '<div class="cap" style="margin-top:12px">'+X("approx")+'</div>'+
      '<button class="btn3" id="hfRst">'+X("reset")+'</button>'+
      '</div>'+
    '</div>';
  var rb=document.getElementById("reelbox");
  rb.parentNode.insertBefore(box,rb);
  cv=document.getElementById("hfCv"); ctx=cv.getContext("2d");
  document.getElementById("hfTks").innerHTML=[HIST_MIN,-1000,0,1000,1500,1800,1900,HIST_MAX]
    .map(function(y){ return '<span style="left:'+(y2p(y)*100)+'%">'+(y<0?Math.abs(y)+"—":y)+'</span>'; }).join("");
  wire();
}

var _open=openSubj;
openSubj=function(sid){
  _open(sid);
  try{
    if(sid==="hist"){
      if(!box) build();
      box.style.display="block"; render();
      if(!spin) spin=setInterval(function(){
        if(!gd&&!drag&&d3ok&&box&&box.style.display!=="none"){ rotL+=0.12; globe(); }
      },70);
    } else if(box){ box.style.display="none"; }
  }catch(err){}
};
